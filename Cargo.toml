[package]
name = "patman"
version = "1.0.0"
edition = "2024"
rust-version = "1.98.1"
description = "Manage personal access token files under $HOME/.pat/ with a secret-free metadata manifest"
authors = ["Darwin Subramaniam <darwinsubramaniam@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/darwinsubramaniam/patman"
homepage = "https://github.com/darwinsubramaniam/patman"
keywords = ["pat", "token", "secrets", "credentials", "cli"]
categories = ["command-line-utilities", "authentication"]
# Everything the crate needs to build and nothing else: the devcontainer, the
# Claude Code skill, and editor config are repo furniture, not package contents.
# Leading slashes matter: include globs are gitignore-style, so a bare
# "README.md" would also sweep in skills/README.md and packaging/*/README.md.
include = ["/src/**/*.rs", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

# Lets `cargo binstall patman` pull the prebuilt binary from a GitHub release
# instead of compiling. Must stay in step with the archive naming in
# .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.{ archive-format }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "patman"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7.5.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Sealed token files. Only the raw KDF is wanted from argon2 — the
# `password-hash` default feature is the PHC string format, which patman has no
# use for, and it drags in base64/phc parsing. `zeroize` wipes the intermediate
# hashing state, which is the whole point of being careful here.
argon2 = { version = "0.6.0", default-features = false, features = [
    "alloc",
    "zeroize",
] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = [
    "alloc",
    "zeroize",
] }
getrandom = "0.4.3"

# `setsid(2)`, so the unlock agent survives the terminal that started it closing.
# Unix-only: the agent is a unix-socket design and is not built on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Touch ID (or the login password) for services that need approval per request.
# The prompt runs inside the unlock agent, out of band from the caller, so an
# agent driving `patman curl` cannot answer it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
block2 = "0.6"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
